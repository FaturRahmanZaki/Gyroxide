services:
  gyroxide:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gyroxide
    image: gyroxide:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "127.0.0.1:49153:49152"
    volumes:
      - ./proxies.txt:/app/proxies.txt
      - ./.env:/app/.env:ro
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:49152/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
