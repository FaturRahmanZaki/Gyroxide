services:
  gyroxide:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gyroxide
    image: gyroxide:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "49152:49152"
    volumes:
      - ./proxies.txt:/app/proxies.txt:ro
      - ./.env:/app/.env:ro
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "sh", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
